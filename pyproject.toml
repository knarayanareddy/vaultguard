[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultguard"
version = "0.1.0"
description = "Tamper-evident cryptographically signed append-only audit ledger with SHA-256 hash chaining"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
vaultguard = "vaultguard.cli:main"

[tool.setuptools.packages.find]
include = ["vaultguard*"]